version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: leadflow-postgres
    restart: always

    environment:
      POSTGRES_DB: leadflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend

    container_name: leadflow-backend

    restart: always

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/leadflow

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

  frontend:
    build: .

    container_name: leadflow-frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "8080:80"

volumes:
  postgres_data:
